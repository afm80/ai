<style>
:root{
--bg-primary:#0a0a0a;--bg-secondary:#111;--bg-card:#1a1a1a;--bg-hover:#222;
--text-primary:#fff;--text-secondary:#a0a0a0;--border-color:#333;--accent:#6366f1;
--accent-hover:#4f46e5;--shadow:0 4px 20px rgba(0,0,0,.4);--gradient:linear-gradient(135deg,#6366f1,#8b5cf6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg-primary);color:var(--text-primary);
min-height:100vh;padding:20px 20px 0;line-height:1.6;transition:background .3s,color .3s;
display:flex;flex-direction:column}
.container{max-width:1200px;margin:0 auto;flex:1}
.header{text-align:center;padding:40px 20px}
.header h1{font-size:36px;font-weight:700;margin-bottom:12px;background:var(--gradient);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--text-secondary);font-size:16px;max-width:600px;margin:0 auto}
.search-box{max-width:500px;margin:0 auto 40px;position:relative}
.search-box input{width:100%;padding:16px 20px;border-radius:16px;border:2px solid var(--border-color);
background:var(--bg-card);color:var(--text-primary);font-size:15px;font-family:inherit;
transition:all .3s}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.search-box input::placeholder{color:var(--text-secondary)}
.categories{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 30px}
.category-btn{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-color);
padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;
font-weight:500;transition:all .2s}
.category-btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--accent)}
.category-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 10px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;
padding:20px;transition:all .3s;cursor:pointer;text-decoration:none;display:block;
color:inherit;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;
justify-content:center;flex-shrink:0;background:var(--bg-hover);padding:10px;margin:0 auto}
.card-icon img{width:100%;height:100%;object-fit:contain}
.card-info{text-align:center}
.card-info h3{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text-primary)}
.card-info .url{font-size:11px;color:var(--text-secondary);opacity:.7;font-family:monospace;
word-break:break-all}
.card-desc{color:var(--text-secondary);font-size:13px;line-height:1.5;
text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:auto}
.tag{background:var(--bg-hover);color:var(--text-secondary);padding:4px 10px;
border-radius:8px;font-size:11px;font-weight:500;border:1px solid var(--border-color);
transition:all .2s;white-space:nowrap}
.tag:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{text-align:center;padding:80px 20px;color:var(--text-secondary);font-size:17px}
.hidden{display:none}
.footer{margin-top:auto;padding:25px 20px;text-align:center;border-top:1px solid var(--border-color);
background:var(--bg-secondary)}
.footer-content{color:var(--text-secondary);font-size:15px}
.footer-content a{color:var(--accent);text-decoration:none;font-weight:700;
transition:all .2s}
.footer-content a:hover{text-decoration:underline}
@media(max-width:600px){
.header h1{font-size:26px}.grid{grid-template-columns:1fr}.card{padding:16px}
.card-icon{width:44px;height:44px}.card-info h3{font-size:15px}
}
</style>
</head>

<div class="grid" id="cardsGrid"></div>
</div>

<footer class="footer">
<div class="footer-content">

let currentCategory = 'all';

function renderCards(){
const grid = document.getElementById('cardsGrid');
const filtered = currentCategory === 'all' 
    ? platforms 
    : platforms.filter(p => {
        const tagText = p.tags.join(' ').toLowerCase();
        const descText = p.desc.toLowerCase();
        return tagText.includes(currentCategory) || descText.includes(currentCategory);
    });
grid.innerHTML = filtered.map(p => `
<a href="${p.url}" target="_blank" class="card" data-name="${p.name.toLowerCase()}">
<div class="card-icon">
<img src="${p.icon}" alt="${p.name}" onerror="this.parentElement.style.display='none'">
</div>
<div class="card-info">
<h3>${p.name}</h3>
<span class="url">${p.url}</span>
<div class="card-desc">${p.desc}</div>
<div class="card-tags">
${p.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}
</div>
</div>
</a>
`).join('');
}

function filterByCategory(category){
currentCategory = category;
document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
renderCards();
}



function filterCards(){
const query = document.getElementById('searchInput').value.toLowerCase();
const cards = document.querySelectorAll('.card');
let hasResults = false;
cards.forEach(card => {
const name = card.dataset.name;
const desc = card.querySelector('.card-desc').textContent.toLowerCase();
const tags = card.querySelector('.card-tags').textContent.toLowerCase();
const match = name.includes(query) || desc.includes(query) || tags.includes(query);
card.classList.toggle('hidden', !match);
if(match) hasResults = true;
});
const grid = document.getElementById('cardsGrid');
if(!hasResults){
grid.innerHTML = '<div class="empty">لا توجد نتائج</div>';
} else if(!grid.querySelector('.card')){
renderCards();
filterCards();
}
}

renderCards();
</script>
